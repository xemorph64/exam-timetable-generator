<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exam Timetable Generator</title>
  <meta name="description" content="Graph-colouring exam timetable generator (Greedy, DSATUR, Backtracking, Branch and Bound) - the C++17 program compiled to WebAssembly.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div>
      <h1>Exam Timetable Generator</h1>
      <p>Graph colouring &middot; Greedy &middot; DSATUR &middot; Backtracking &middot; Branch and Bound &mdash; the real C++17 program, running in your browser via WebAssembly.</p>
    </div>
    <a class="repo" href="https://github.com/xemorph64/exam-timetable-generator" target="_blank" rel="noopener">Source on GitHub</a>
  </header>

  <main class="terminal" id="terminal" aria-live="polite">
    <pre id="output"><span class="dim">Loading the program...</span>
</pre>
  </main>

  <form class="input-bar" id="form" autocomplete="off">
    <span class="caret" aria-hidden="true">&gt;</span>
    <input id="input" type="text" inputmode="text" spellcheck="false" aria-label="Program input" placeholder="Type a menu number or answer, then Enter" disabled>
    <button type="submit" id="send" disabled>Send</button>
  </form>
  <nav class="chips" aria-label="Quick answers">
    <button type="button" data-send="">Enter</button>
    <button type="button" data-send="y">y</button>
    <button type="button" data-send="n">n</button>
    <span class="hint">Try: <code>11</code> &rarr; <code>2</code> (Sample B), then <code>9</code> to compare greedy vs optimal.</span>
    <button type="button" id="restart" class="restart" hidden>Restart program</button>
  </nav>

  <script src="app.js"></script>
  <script src="timetable.js"></script>
  <script>startTimetable();</script>
</body>
</html>
